name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 21 einrichten
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Die Tests laufen gegen pgvector via Testcontainers (Docker ist auf
      # den GitHub-Runnern vorhanden) und mit Fake-Modellen, ohne OpenAI-Key.
      - name: Build und Tests
        run: ./mvnw -B verify
